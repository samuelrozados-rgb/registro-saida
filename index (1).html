<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro de Saída de Equipes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#F8F8F6; --surface:#FFFFFF; --border:#E2E2DC; --border-md:#C8C8C0;
    --text:#1A1A18; --muted:#6B6B66; --hint:#9A9A94;
    --blue:#185FA5; --blue-light:#E6F1FB; --blue-dark:#0C447C;
    --green:#3B6D11; --green-light:#EAF3DE;
    --amber:#BA7517; --amber-light:#FAEEDA;
    --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  .header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; }
  .header-logo { width:32px; height:32px; background:var(--blue); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .header-logo svg { width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .header-title { font-size:15px; font-weight:600; }
  .saving-dot { display:none; width:8px; height:8px; border-radius:50%; background:var(--amber); animation:pulse 1s ease-in-out infinite; }
  .saving-dot.active { display:inline-block; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .header-date { margin-left:auto; font-size:12px; color:var(--muted); }

  .main { max-width:560px; margin:0 auto; padding:24px 16px 80px; }
  .step { display:none; } .step.active { display:block; }

  .loading-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; gap:12px; }
  .spinner { width:28px; height:28px; border:2.5px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-state p { font-size:14px; color:var(--muted); }

  .error-state { background:#FCEBEB; border:1px solid #F09595; border-radius:var(--radius-lg); padding:20px; margin:24px 0; font-size:14px; color:#791F1F; line-height:1.6; }
  .error-state strong { display:block; margin-bottom:6px; }

  .section-label { font-size:11px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }

  .fiscal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:32px; }
  .fiscal-btn { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 12px; cursor:pointer; text-align:left; transition:border-color .12s,background .12s,transform .1s; }
  .fiscal-btn:hover { background:#F4F4F0; border-color:var(--border-md); transform:translateY(-1px); }
  .fiscal-btn:active { transform:translateY(0); }
  .fiscal-btn .avatar { width:38px; height:38px; border-radius:50%; background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--blue); margin-bottom:10px; }
  .fiscal-btn .fname { font-size:13px; font-weight:600; color:var(--text); line-height:1.35; }
  .fiscal-btn .fcount { font-size:11px; color:var(--muted); margin-top:3px; }
  .fiscal-btn .fprogress { margin-top:8px; height:3px; background:var(--border); border-radius:2px; }
  .fiscal-btn .fprogress-fill { height:100%; background:var(--blue); border-radius:2px; transition:width .3s; }

  .back-btn { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); background:none; border:none; cursor:pointer; padding:0; margin-bottom:20px; transition:color .12s; }
  .back-btn:hover { color:var(--text); }
  .back-btn svg { width:16px; height:16px; stroke:currentColor; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  .fiscal-header { display:flex; align-items:center; gap:14px; padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:20px; }
  .avatar-lg { width:48px; height:48px; border-radius:50%; background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:var(--blue); flex-shrink:0; }
  .fiscal-header .info .name { font-size:16px; font-weight:600; }
  .fiscal-header .info .sub { font-size:12px; color:var(--muted); margin-top:2px; }

  .summary-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:24px; }
  .scard { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 10px; text-align:center; }
  .scard .sv { font-size:24px; font-weight:600; color:var(--text); }
  .scard .sv.green { color:var(--green); }
  .scard .sv.amber { color:var(--amber); }
  .scard .sl { font-size:11px; color:var(--muted); margin-top:2px; }

  .equipe-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:8px; display:flex; align-items:center; gap:12px; }
  .equipe-icon { width:38px; height:38px; border-radius:var(--radius-md); background:var(--bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .equipe-icon svg { width:20px; height:20px; stroke:var(--muted); stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .equipe-card.done .equipe-icon { background:var(--green-light); }
  .equipe-card.done .equipe-icon svg { stroke:var(--green); }

  .equipe-info { flex:1; min-width:0; }
  .equipe-info .ename { font-size:14px; font-weight:600; }
  .equipe-info .emeta { font-size:12px; color:var(--muted); margin-top:1px; }
  .equipe-info .eobs { font-size:11px; color:var(--muted); margin-top:4px; font-style:italic; }

  .equipe-actions { display:flex; flex-direction:column; gap:6px; flex-shrink:0; align-items:flex-end; }
  .time-badge { font-size:12px; font-weight:600; background:var(--green-light); color:var(--green); padding:5px 10px; border-radius:var(--radius-md); white-space:nowrap; }

  .reg-btn { font-size:13px; font-weight:600; background:var(--blue); color:#fff; border:none; border-radius:var(--radius-md); padding:8px 14px; cursor:pointer; white-space:nowrap; transition:background .12s; }
  .reg-btn:hover { background:var(--blue-dark); }
  .edit-btn { font-size:12px; font-weight:500; background:none; color:var(--muted); border:1px solid var(--border); border-radius:var(--radius-md); padding:5px 10px; cursor:pointer; white-space:nowrap; transition:color .12s,border-color .12s; }
  .edit-btn:hover { color:var(--text); border-color:var(--border-md); }

  .export-row { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .export-btn { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:8px 14px; cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--muted); transition:color .12s,border-color .12s; }
  .export-btn:hover { color:var(--text); border-color:var(--border-md); }
  .export-btn svg { width:14px; height:14px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); align-items:flex-end; justify-content:center; z-index:200; }
  @media(min-width:480px){ .modal-overlay { align-items:center; padding:20px; } }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border-radius:var(--radius-xl) var(--radius-xl) 0 0; padding:24px 20px 32px; width:100%; max-width:420px; }
  @media(min-width:480px){ .modal { border-radius:var(--radius-xl); padding:24px; } }
  .modal-drag { width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 20px; }
  @media(min-width:480px){ .modal-drag { display:none; } }
  .modal h3 { font-size:16px; font-weight:600; margin-bottom:3px; }
  .modal .msub { font-size:13px; color:var(--muted); margin-bottom:20px; }
  .modal-edit-badge { display:inline-block; font-size:11px; font-weight:600; background:var(--amber-light); color:var(--amber); padding:3px 8px; border-radius:var(--radius-md); margin-bottom:16px; }

  .field-label { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; letter-spacing:.03em; }
  .time-row { display:flex; gap:8px; align-items:stretch; margin-bottom:16px; }
  .time-row input[type=time] { flex:1; padding:11px 14px; font-size:18px; font-weight:600; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text); font-family:inherit; }
  .time-row input[type=time]:focus { outline:none; border-color:var(--blue); }
  .now-btn { padding:0 14px; cursor:pointer; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--muted); font-size:12px; font-weight:500; white-space:nowrap; transition:color .12s,border-color .12s; }
  .now-btn:hover { color:var(--text); border-color:var(--border-md); }

  textarea.obs-input { width:100%; padding:11px 14px; font-size:13px; font-family:inherit; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text); resize:none; margin-bottom:20px; line-height:1.5; }
  textarea.obs-input:focus { outline:none; border-color:var(--blue); }

  .modal-actions { display:flex; gap:8px; }
  .confirm-btn { flex:1; background:var(--blue); color:#fff; border:none; border-radius:var(--radius-md); padding:12px; font-size:14px; font-weight:600; cursor:pointer; transition:background .12s; }
  .confirm-btn:hover { background:var(--blue-dark); }
  .confirm-btn:disabled { background:var(--border-md); cursor:not-allowed; }
  .cancel-btn { background:none; border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 20px; font-size:14px; font-weight:500; cursor:pointer; color:var(--muted); transition:color .12s; }
  .cancel-btn:hover { color:var(--text); }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1A1A18; color:#fff; padding:10px 20px; border-radius:100px; font-size:13px; font-weight:500; opacity:0; transition:opacity .2s; z-index:300; pointer-events:none; white-space:nowrap; box-shadow:0 4px 12px rgba(0,0,0,.2); }
  .toast.show { opacity:1; }

  .all-done { display:none; background:var(--green-light); border:1px solid #C0DD97; border-radius:var(--radius-lg); padding:16px; margin-top:16px; text-align:center; font-size:14px; font-weight:600; color:var(--green); }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
  </div>
  <span class="header-title">Registro de Saída</span>
  <span class="saving-dot" id="saving-dot"></span>
  <span class="header-date" id="header-date"></span>
</div>

<div class="main">
  <!-- STEP 1 -->
  <div class="step active" id="step-fiscal">
    <div style="margin-bottom:20px">
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">Quem é você?</div>
      <div style="font-size:13px;color:var(--muted)">Selecione seu nome para ver suas equipes</div>
    </div>
    <div id="loading-fiscais" class="loading-state"><div class="spinner"></div><p>Carregando fiscais...</p></div>
    <div id="error-fiscais" style="display:none"></div>
    <div class="section-label" id="label-fiscais" style="display:none">Fiscais</div>
    <div class="fiscal-grid" id="fiscal-grid"></div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step-equipes">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Trocar fiscal
    </button>
    <div id="loading-equipes" class="loading-state" style="display:none"><div class="spinner"></div><p>Carregando registros de hoje...</p></div>
    <div id="conteudo-equipes" style="display:none">
      <div class="fiscal-header">
        <div class="avatar-lg" id="eq-avatar"></div>
        <div class="info"><div class="name" id="eq-nome"></div><div class="sub" id="eq-sub"></div></div>
      </div>
      <div class="summary-cards" id="summary-cards"></div>
      <div class="section-label">Equipes sob sua responsabilidade</div>
      <div id="equipes-list"></div>
      <div class="all-done" id="all-done">✓ Todas as equipes foram registradas hoje</div>
      <div class="export-row">
        <button class="export-btn" onclick="exportarCSV()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar CSV
        </button>
        <button class="export-btn" onclick="copiarTexto()">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copiar resumo
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-drag"></div>
    <h3 id="modal-title"></h3>
    <div class="msub" id="modal-sub"></div>
    <div id="modal-edit-badge" class="modal-edit-badge" style="display:none">✏️ Editando registro existente</div>
    <div class="field-label">Horário de saída</div>
    <div class="time-row">
      <input type="time" id="time-input" />
      <button class="now-btn" onclick="setNow()">Agora</button>
    </div>
    <div class="field-label">Observação <span style="font-weight:400;color:var(--hint)">(opcional)</span></div>
    <textarea class="obs-input" id="obs-input" rows="2" placeholder="Ex: equipe saiu com atraso por chuva..."></textarea>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancelar</button>
      <button class="confirm-btn" id="confirm-btn" onclick="confirmarRegistro()">Confirmar saída</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
// CONFIGURAÇÃO
// ══════════════════════════════════════════════
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7R9KtimGaOjELK_eD3cYguVzBhDXB2NPWdRcXDshCBKZ1B2nsr2Yj1Ijcvrw6zxat/exec";
// ══════════════════════════════════════════════

let state = {
  fiscalNome: null,
  equipes:    [],
  registros:  {}   // chave: nomeEquipe → { hora, obs, rowIndex }
};
let allFiscais = [];
let pendingEquipe = null;
let modoEdicao = false;

// ── DATA NO HEADER ─────────────────────────────
document.getElementById("header-date").textContent =
  new Date().toLocaleDateString("pt-BR", { weekday:"short", day:"numeric", month:"short" });

// ── CARREGAR FISCAIS ───────────────────────────
carregarFiscais();

async function carregarFiscais() {
  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?acao=listarFiscais`);
    const data = await res.json();
    if (data.erro) throw new Error(data.erro);
    allFiscais = data.fiscais;
    document.getElementById("loading-fiscais").style.display = "none";
    document.getElementById("label-fiscais").style.display  = "block";
    renderFiscais();
  } catch(e) {
    document.getElementById("loading-fiscais").style.display = "none";
    document.getElementById("error-fiscais").style.display   = "block";
    document.getElementById("error-fiscais").innerHTML = `
      <div class="error-state">
        <strong>Não foi possível carregar os fiscais</strong>
        Verifique se a URL do Apps Script está correta e se a planilha está configurada.<br><br>
        <small>${e.message}</small>
      </div>`;
  }
}

// ── RENDER FISCAIS ─────────────────────────────
function initials(nome) {
  return nome.trim().split(/\s+/).slice(0,2).map(p=>p[0].toUpperCase()).join("");
}

function renderFiscais() {
  const grid = document.getElementById("fiscal-grid");
  grid.innerHTML = "";
  allFiscais.forEach(f => {
    const total  = f.equipes.length;
    const feitos = f.equipes.filter(eq => state.fiscalNome === f.nome && state.registros[eq]).length;
    const pct    = total > 0 ? Math.round((feitos/total)*100) : 0;
    const btn    = document.createElement("button");
    btn.className = "fiscal-btn";
    btn.innerHTML = `
      <div class="avatar">${initials(f.nome)}</div>
      <div class="fname">${f.nome}</div>
      <div class="fcount">${total} equipe${total!==1?"s":""}</div>
      <div class="fprogress"><div class="fprogress-fill" style="width:${pct}%"></div></div>`;
    btn.onclick = () => selectFiscal(f);
    grid.appendChild(btn);
  });
}

// ── SELECIONAR FISCAL ──────────────────────────
async function selectFiscal(fiscal) {
  state.fiscalNome = fiscal.nome;
  state.equipes    = fiscal.equipes;
  state.registros  = {};

  document.getElementById("eq-avatar").textContent = initials(fiscal.nome);
  document.getElementById("eq-nome").textContent   = fiscal.nome;

  document.getElementById("step-fiscal").classList.remove("active");
  document.getElementById("step-equipes").classList.add("active");
  document.getElementById("loading-equipes").style.display  = "flex";
  document.getElementById("conteudo-equipes").style.display = "none";

  // Busca registros de hoje para este fiscal
  try {
    const hoje = new Date().toLocaleDateString("pt-BR");
    const res  = await fetch(`${APPS_SCRIPT_URL}?acao=buscarRegistrosHoje&fiscal=${encodeURIComponent(fiscal.nome)}&data=${encodeURIComponent(hoje)}`);
    const data = await res.json();
    if (data.erro) throw new Error(data.erro);

    // Preenche state.registros com o que já existe hoje
    (data.registros || []).forEach(r => {
      state.registros[r.equipe] = { hora: r.hora, obs: r.obs, rowIndex: r.rowIndex };
    });
  } catch(e) {
    // Se falhar a busca, continua sem registros (não bloqueia o uso)
    console.warn("Aviso: não foi possível carregar registros de hoje.", e.message);
  }

  document.getElementById("loading-equipes").style.display  = "none";
  document.getElementById("conteudo-equipes").style.display = "block";
  renderEquipes();
}

// ── RENDER EQUIPES ─────────────────────────────
function renderEquipes() {
  const total    = state.equipes.length;
  const feitos   = state.equipes.filter(eq => state.registros[eq]).length;
  const pendentes = total - feitos;

  document.getElementById("eq-sub").textContent = `${feitos} de ${total} equipes registradas hoje`;
  document.getElementById("summary-cards").innerHTML = `
    <div class="scard"><div class="sv">${total}</div><div class="sl">Total</div></div>
    <div class="scard"><div class="sv green">${feitos}</div><div class="sl">Registradas</div></div>
    <div class="scard"><div class="sv ${pendentes>0?"amber":"green"}">${pendentes}</div><div class="sl">Pendentes</div></div>`;

  const list = document.getElementById("equipes-list");
  list.innerHTML = "";

  const svgUsers = `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`;
  const svgCheck = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;

  state.equipes.forEach(nomeEquipe => {
    const reg  = state.registros[nomeEquipe];
    const card = document.createElement("div");
    card.className = "equipe-card" + (reg ? " done" : "");

    const safeName = nomeEquipe.replace(/'/g, "\\'");
    card.innerHTML = `
      <div class="equipe-icon">${reg ? svgCheck : svgUsers}</div>
      <div class="equipe-info">
        <div class="ename">${nomeEquipe}</div>
        ${reg && reg.obs ? `<div class="eobs">"${reg.obs}"</div>` : ""}
      </div>
      <div class="equipe-actions">
        ${reg
          ? `<div class="time-badge">${reg.hora}</div>
             <button class="edit-btn" onclick="openModal('${safeName}', true)">Editar</button>`
          : `<button class="reg-btn" onclick="openModal('${safeName}', false)">Registrar saída</button>`
        }
      </div>`;
    list.appendChild(card);
  });

  document.getElementById("all-done").style.display =
    (feitos === total && total > 0) ? "block" : "none";

  renderFiscais();
}

// ── MODAL ──────────────────────────────────────
function nowStr() {
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

function openModal(nomeEquipe, editando) {
  pendingEquipe = nomeEquipe;
  modoEdicao    = editando;
  const reg = state.registros[nomeEquipe];

  document.getElementById("modal-title").textContent      = nomeEquipe;
  document.getElementById("modal-sub").textContent        = `Fiscal: ${state.fiscalNome}`;
  document.getElementById("modal-edit-badge").style.display = editando ? "inline-block" : "none";
  document.getElementById("time-input").value             = editando && reg ? reg.hora : nowStr();
  document.getElementById("obs-input").value              = editando && reg ? (reg.obs || "") : "";
  document.getElementById("confirm-btn").disabled         = false;
  document.getElementById("confirm-btn").textContent      = editando ? "Salvar alteração" : "Confirmar saída";
  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  pendingEquipe = null;
  modoEdicao    = false;
}

function setNow() { document.getElementById("time-input").value = nowStr(); }

// ── CONFIRMAR / EDITAR ─────────────────────────
async function confirmarRegistro() {
  const hora = document.getElementById("time-input").value;
  const obs  = document.getElementById("obs-input").value.trim();
  if (!hora) { showToast("Informe o horário"); return; }

  const btn = document.getElementById("confirm-btn");
  btn.disabled    = true;
  btn.textContent = "Salvando...";
  document.getElementById("saving-dot").classList.add("active");

  const rowIndex = modoEdicao && state.registros[pendingEquipe]
    ? state.registros[pendingEquipe].rowIndex
    : null;

  const payload = {
    acao:     modoEdicao ? "editarSaida" : "registrarSaida",
    fiscal:   state.fiscalNome,
    equipe:   pendingEquipe,
    hora:     hora,
    obs:      obs,
    data:     new Date().toLocaleDateString("pt-BR"),
    rowIndex: rowIndex
  };

  try {
    const res  = await fetch(APPS_SCRIPT_URL, { method:"POST", body:JSON.stringify(payload) });
    const data = await res.json();
    if (data.erro) throw new Error(data.erro);

    state.registros[pendingEquipe] = {
      hora,
      obs,
      rowIndex: data.rowIndex || rowIndex
    };

    closeModal();
    renderEquipes();
    showToast(modoEdicao ? "Registro atualizado ✓" : "Saída registrada ✓");
  } catch(e) {
    btn.disabled    = false;
    btn.textContent = modoEdicao ? "Salvar alteração" : "Confirmar saída";
    showToast("Erro ao salvar — tente novamente");
    console.error(e);
  } finally {
    document.getElementById("saving-dot").classList.remove("active");
  }
}

// ── VOLTAR ─────────────────────────────────────
function goBack() {
  document.getElementById("step-equipes").classList.remove("active");
  document.getElementById("step-fiscal").classList.add("active");
  document.getElementById("conteudo-equipes").style.display = "none";
  document.getElementById("loading-equipes").style.display  = "none";
  state.fiscalNome = null;
  renderFiscais();
}

// ── EXPORTAR CSV ───────────────────────────────
function exportarCSV() {
  const hoje = new Date().toLocaleDateString("pt-BR");
  let csv = "Data,Fiscal,Equipe,Horário de Saída,Observação\n";
  state.equipes.forEach(eq => {
    const reg = state.registros[eq];
    csv += `"${hoje}","${state.fiscalNome}","${eq}","${reg?reg.hora:""}","${reg&&reg.obs?reg.obs:""}"\n`;
  });
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href     = URL.createObjectURL(blob);
  a.download = `saidas_${state.fiscalNome.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast("CSV exportado");
}

// ── COPIAR RESUMO ──────────────────────────────
function copiarTexto() {
  const hoje = new Date().toLocaleDateString("pt-BR");
  let txt = `Registros de saída — ${state.fiscalNome}\nData: ${hoje}\n\n`;
  state.equipes.forEach(eq => {
    const reg = state.registros[eq];
    txt += `• ${eq}: ${reg?reg.hora:"pendente"}${reg&&reg.obs?" — "+reg.obs:""}\n`;
  });
  navigator.clipboard.writeText(txt).then(() => showToast("Resumo copiado"));
}

// ── TOAST ──────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}
</script>
